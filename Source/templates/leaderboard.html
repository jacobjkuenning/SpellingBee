<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Leaderboard - Spelling Bee</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 450px;
            background-color: #ffffff;
            border: 2px solid #ccc;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-top: 0;
            margin-bottom: 5px;
        }

        .date-sub {
            font-size: 13px;
            color: #777;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #fafafa;
            color: #444;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        .no-scores {
            color: #666;
            font-style: italic;
            margin: 20px 0;
        }

        .btn-link {
            display: inline-block;
            padding: 8px 15px;
            background-color: #e0e0e0;
            border: 1px solid #999;
            color: #000;
            text-decoration: none;
            font-size: 14px;
        }

        .btn-link:hover {
            background-color: #d0d0d0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Leaderboard</h1>
        <div class="date-sub">Top Scores for {{ puzzle_date }}</div>

        {% if top_users %}
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Username</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in top_users %}
                        <tr>
                            <td>{{ loop.index }}</td>
                            <td>{{ user.username }}</td>
                            <td>{{ user.score }}</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% else %}
            <div class="no-scores">No scores recorded for today yet. Be the first!</div>
        {% endif %}

        <a href="{{ url_for('index') }}" class="btn-link">Back to Game</a>
    </div>

</body>
</html>
