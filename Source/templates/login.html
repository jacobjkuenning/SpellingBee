{% extends "base.html" %}

{% block title %}Spelling Bee - Login{% endblock %}
{% block container_class %}auth-container{% endblock %}

{% block content %}
    <h1>Login</h1>

    <div id="error-box" class="error-message" {% if error %}style="display: block;"{% endif %}>
        {{ error or '' }}
    </div>

    <form id="login-form" action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
            <label for="identifier">Username or Email</label>
            <input type="text" id="identifier" name="identifier" value="{{ identifier or '' }}">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password">
        </div>

        <button type="submit" class="btn-submit">Log In</button>
    </form>

    <div class="nav-section">
        Don't have an account? <a href="{{ url_for('signup') }}">Sign Up</a> | 
        <a href="{{ url_for('index') }}">Back to Game</a>
    </div>
{% endblock %}

{% block scripts %}
<script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error-box');

    form.addEventListener('submit', function (e) {
        const identifier = document.getElementById('identifier').value.trim();
        const password = document.getElementById('password').value;

        errorBox.style.display = 'none';
        errorBox.textContent = '';

        if (identifier === '' || password === '') {
            e.preventDefault();
            errorBox.textContent = 'Please fill out all fields.';
            errorBox.style.display = 'block';
        }
    });
</script>
{% endblock %}
