{% extends "base.html" %}

{% block title %}Spelling Bee - Sign Up{% endblock %}
{% block container_class %}auth-container{% endblock %}

{% block content %}
    <h1>Create Account</h1>

    <div id="error-box" class="error-message" {% if error %}style="display: block;"{% endif %}>
        {{ error or '' }}
    </div>

    <form id="signup-form" action="{{ url_for('signup') }}" method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" value="{{ username or '' }}">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ email or '' }}">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password">
        </div>

        <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm_password">
        </div>

        <button type="submit" class="btn-submit">Sign Up</button>
    </form>

    <div class="nav-section">
        Already have an account? <a href="{{ url_for('login') }}">Log In</a> | 
        <a href="{{ url_for('index') }}">Back to Game</a>
    </div>
{% endblock %}

{% block scripts %}
<script>
    const form = document.getElementById('signup-form');
    const errorBox = document.getElementById('error-box');

    form.addEventListener('submit', function (e) {
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        errorBox.style.display = 'none';
        errorBox.textContent = '';

        if (username === '' || email === '' || password === '' || confirmPassword === '') {
            e.preventDefault();
            showError('All fields are required.');
            return;
        }

        if (username.length < 3) {
            e.preventDefault();
            showError('Username must be at least 3 characters long.');
            return;
        }

        if (!email.includes('@') || !email.includes('.')) {
            e.preventDefault();
            showError('Please enter a valid email address.');
            return;
        }

        if (password.length < 6) {
            e.preventDefault();
            showError('Password must be at least 6 characters long.');
            return;
        }

        if (password !== confirmPassword) {
            e.preventDefault();
            showError('Passwords do not match.');
            return;
        }
    });

    function showError(msg) {
        errorBox.textContent = msg;
        errorBox.style.display = 'block';
    }
</script>
{% endblock %}
